name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    # Test offline (LLM giả lập) + parser chạy trên CardDemo thật + nhãn tay phải trích đúng dòng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: make install
      - run: make lint
      - run: make data
      - run: make test
      - run: make stats graph check-gold
      - uses: actions/upload-artifact@v4
        with: { name: reports, path: reports/ }
