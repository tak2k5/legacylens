[project]
name = "legacylens"
version = "0.1.0"
description = "Read COBOL, extract business rules with line-level citations, write design docs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["networkx>=3.2", "pydantic>=2.6", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ui = ["streamlit>=1.35"]

[project.scripts]
legacylens = "legacylens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
